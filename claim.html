<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start your claim – DelayPay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">

  <style>
    :root{
      --background: oklch(0.972 0.006 260);
      --foreground: oklch(0.28 0.025 262);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.28 0.025 262);
      --muted-foreground: oklch(0.55 0.02 262);
      --border: oklch(0.9 0.008 260);
      --navy: oklch(0.19 0.03 262);
      --navy-foreground: oklch(0.97 0.006 260);
      --navy-muted: oklch(0.7 0.02 262);
      --brand: oklch(0.62 0.17 253);
      --brand-foreground: oklch(0.99 0 0);
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--background); color:var(--foreground); -webkit-font-smoothing:antialiased;}
    a{color:inherit; text-decoration:none;}
    a:hover{color:var(--brand);}
  </style>

<style>
  html, body { overflow-x: auto; }
  body { display: flex; justify-content: center; }
</style>
</head>
<body>
<div style="width:1440px; min-height:1100px; background:var(--background);">
  <header style="border-bottom:1px solid var(--border); background:var(--navy); color:var(--navy-foreground);">
    <div style="max-width:896px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
      <a href="#" style="display:flex; align-items:center; gap:8px; border-radius:9999px; background:var(--navy-foreground); padding:8px 16px;">
        <span style="position:relative; display:inline-flex; align-items:center; font-size:18px; font-weight:700; letter-spacing:-0.02em; color:var(--navy);">Dela<span style="position:relative">y<svg aria-hidden="true" viewBox="0 0 28 16" style="position:absolute; top:-6px; left:50%; width:20px; height:10px; transform:translateX(-50%); color:var(--brand);" fill="none"><path d="M2 12 L11 4 L15 9 L26 2" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Pay</span>
      </a>
      <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--navy-muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to home
      </a>
    </div>
  </header>

  <div style="max-width:896px; margin:0 auto; padding:48px 24px;">
    <div style="margin:0 auto; max-width:576px; text-align:center;">
      <span style="display:inline-block; border-radius:9999px; background:oklch(0.62 0.17 253 / 0.1); padding:4px 12px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--brand);">Start your claim</span>
      <h1 style="margin:20px 0 0; font-size:48px; font-weight:700; line-height:1.1; letter-spacing:-0.02em;">Let's get you paid</h1>
      <p style="margin:16px auto 0; max-width:448px; line-height:1.6; color:var(--muted-foreground);">Tell us about your flight and we'll handle the airline, the paperwork, and the regulator — end to end.</p>

      <div style="margin-top:24px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:24px;">
        <span style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted-foreground);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L20 5.5 V11c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5.5Z"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg>
          No win, no fee
        </span>
        <span style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted-foreground);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          2-minute submission
        </span>
        <span style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted-foreground);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L14.5 4 L18 3.5 L18.5 7 L21 9 L19.5 12 L21 15 L18.5 17 L18 20.5 L14.5 20 L12 22 L9.5 20 L6 20.5 L5.5 17 L3 15 L4.5 12 L3 9 L5.5 7 L6 3.5 L9.5 4 Z"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg>
          AI-checked eligibility
        </span>
      </div>
    </div>

    <div style="margin:40px auto 0; max-width:576px; border-radius:32px; border:1px solid var(--border); background:var(--card); padding:32px; box-shadow:0 20px 40px rgb(0 0 0 / 0.08);">
      <div style="display:grid; gap:20px;">
        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">Claim type</span>
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px;">
            Flight delay
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </label>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          <label style="display:block;">
            <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">Full name</span>
            <div style="width:100%; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px; color:var(--muted-foreground);">Jane Traveler</div>
          </label>
          <label style="display:block;">
            <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">Email</span>
            <div style="width:100%; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px; color:var(--muted-foreground);">jane@example.com</div>
          </label>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          <label style="display:block;">
            <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">Flight number</span>
            <div style="width:100%; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px; color:var(--muted-foreground);">LY 315</div>
          </label>
          <label style="display:block;">
            <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">Flight date</span>
            <div style="width:100%; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px; color:var(--muted-foreground);">dd/mm/yyyy</div>
          </label>
        </div>

        <label style="display:block;">
          <span style="display:block; margin-bottom:8px; font-size:14px; font-weight:500;">What happened?</span>
          <div style="width:100%; height:76px; border-radius:20px; border:1px solid var(--border); background:var(--background); padding:12px 16px; font-size:14px; color:var(--muted-foreground);">Briefly describe the disruption to your flight.</div>
        </label>
      </div>

      <button style="margin-top:24px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:9999px; background:var(--brand); color:var(--brand-foreground); padding:14px 24px; font-size:14px; font-weight:600;">
        Submit my claim
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <p style="margin:12px 0 0; text-align:center; font-size:12px; color:var(--muted-foreground);">No win, no fee. We only get paid when you do.</p>
    </div>
  </div>
</div>
</body>
</html>
